<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Anime-inspired software engineer profile illustration</title>
  <desc id="desc">An original anime-inspired developer character introducing full-stack development, AI, and product engineering.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#dff3f5"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2463eb"/>
      <stop offset="1" stop-color="#123b91"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17324d" flood-opacity=".16"/>
    </filter>
    <style>
      .speech-panel { animation: panel-pop 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      .profile-character { animation: character-pop 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      @keyframes panel-pop {
        0%, 8%, 100% { opacity: 0; transform: translateY(18px) scale(.96); }
        18%, 78% { opacity: 1; transform: translateY(0) scale(1); }
        88% { opacity: 0; transform: translateY(10px) scale(.98); }
      }
      @keyframes character-pop {
        0%, 8%, 100% { transform: translateY(42px); }
        18%, 78% { transform: translateY(0); }
        88% { transform: translateY(16px); }
      }
    </style>
  </defs>

  <rect width="1000" height="420" rx="28" fill="url(#background)"/>
  <path d="M0 350 Q170 270 340 350 T680 350 T1000 330 V420 H0Z" fill="#c9e9ed" opacity=".7"/>
  <circle cx="82" cy="72" r="18" fill="#ffbf69" opacity=".8"/>
  <circle cx="910" cy="92" r="28" fill="#7bdff2" opacity=".7"/>

  <g class="speech-panel" filter="url(#shadow)">
    <rect x="355" y="42" width="585" height="300" rx="26" fill="#ffffff"/>
    <path d="M400 342 l-26 28 46-10 25 28 12-46z" fill="#ffffff"/>
  </g>
  <g class="speech-panel">
    <text x="402" y="92" font-family="Verdana, sans-serif" font-size="23" font-weight="700" fill="#123b91">Hi, I’m mmbasu-8866!</text>
    <text x="402" y="134" font-family="Verdana, sans-serif" font-size="18" fill="#344054">I build useful software with</text>
    <text x="402" y="170" font-family="Verdana, sans-serif" font-size="22" font-weight="700" fill="#2463eb">code, curiosity, and AI.</text>
  </g>
  <g class="speech-panel" font-family="Verdana, sans-serif" font-size="16" fill="#344054">
    <rect x="402" y="204" width="220" height="40" rx="20" fill="#eaf2ff"/>
    <text x="422" y="230">&gt; Full-stack builder</text>
    <rect x="638" y="204" width="220" height="40" rx="20" fill="#e8faf7"/>
    <text x="658" y="230">&gt; AI explorer</text>
    <rect x="402" y="258" width="296" height="40" rx="20" fill="#fff4df"/>
    <text x="422" y="284">&gt; Product-minded engineer</text>
  </g>
  <text class="speech-panel" x="402" y="326" font-family="Verdana, sans-serif" font-size="15" fill="#667085">Turning ideas into practical products.</text>

  <g class="profile-character" transform="translate(82 68)">
    <path d="M65 188 Q62 116 108 88 Q154 116 151 188Z" fill="url(#jacket)"/>
    <path d="M91 178 L108 147 126 178" fill="#ffffff"/>
    <path d="M104 150 L108 174 112 150" fill="#ffbf69"/>
    <path d="M83 182 Q108 164 133 182 L141 240 75 240Z" fill="#ffffff"/>
    <path d="M75 240 Q108 218 141 240 L154 294 H62Z" fill="url(#jacket)"/>
    <path d="M94 235 L108 261 122 235" fill="none" stroke="#9ec5ff" stroke-width="5"/>
    <path d="M76 111 Q74 51 108 34 Q144 50 141 111 Q129 145 108 147 Q87 145 76 111Z" fill="#ffcfaa"/>
    <path d="M72 103 Q56 46 91 18 Q130 -10 161 43 Q155 76 140 94 Q135 66 119 56 Q101 79 72 103Z" fill="#182b5c"/>
    <path d="M78 96 Q62 72 70 49" fill="none" stroke="#3156a6" stroke-width="12" stroke-linecap="round"/>
    <path d="M139 96 Q159 72 149 51" fill="none" stroke="#3156a6" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="91" cy="105" rx="7" ry="10" fill="#182b5c"/>
    <ellipse cx="125" cy="105" rx="7" ry="10" fill="#182b5c"/>
    <path d="M98 130 Q108 137 118 130" fill="none" stroke="#c56b68" stroke-width="4" stroke-linecap="round"/>
    <path d="M68 187 Q50 202 45 232" fill="none" stroke="#ffcfaa" stroke-width="17" stroke-linecap="round"/>
    <path d="M148 187 Q167 202 174 232" fill="none" stroke="#ffcfaa" stroke-width="17" stroke-linecap="round"/>
    <rect x="35" y="227" width="38" height="28" rx="8" fill="#172b4d"/>
    <path d="M42 234 H66 M42 242 H62" stroke="#7bdff2" stroke-width="3"/>
  </g>
</svg>